version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      rust-crates:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  # The Socket CLI used by socket.yml (pyproject.toml + uv.lock).
  - package-ecosystem: "uv"
    directory: "/.github/socket"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      socket-cli:
        patterns:
          - "*"
