name: PR

on:
  pull_request:

permissions: {}

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    uses: $/.github/workflows/version.yml
    permissions:
      contents: read

  product:
    name: "Product version: ${{ needs.version.outputs.next_version }}-pr.${{ github.event.pull_request.number }}.${{ github.run_id }}.${{ github.run_attempt }}"
    needs: version
    uses: $/.github/workflows/product.yml
    with:
      version: ${{ needs.version.outputs.next_version }}-pr.${{ github.event.pull_request.number }}.${{ github.run_id }}.${{ github.run_attempt }}
    secrets:
      SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
      issues: write
      pull-requests: write

  # Always runs, so a failure shows as a failed check and not a skipped one.
  # This is the single required status check for main.
  merge-gate:
    name: Merge gate
    needs: [version, product]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Ok to merge
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "* | *" skipped "*)
              echo "a required job failed, was cancelled or was skipped" >&2
              exit 1
              ;;
          esac
          echo "OK to merge"
