name: Product

on:
  workflow_call:
    inputs:
      all-targets:
        description: Build every release target
        type: boolean
        default: false
      version:
        description: Cargo version, X.Y.Z or X.Y.Z-pr.N.N.N
        type: string
        required: true
    secrets:
      SOCKET_SECURITY_API_KEY:
        required: false

permissions: {}

env:
  PRODUCT_VERSION: ${{ inputs.version }}
  # Builds start from an empty target/ (tests on pull requests from main's), so
  # incremental output is never reused.
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

# release.yml builds the signed binaries with this workflow, and a restored cache entry
# could be written by any workflow run on main, so no job whose output is released uses
# actions/cache. The one exception is the test job: its output isn't released, main
# always builds from scratch and saves, and every other run only restores.

jobs:
  vuln-check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans licenses sources

  codeql:
    uses: $/.github/workflows/codeql.yml
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

  zizmor:
    uses: $/.github/workflows/zizmor.yml
    permissions:
      security-events: write
      contents: read
      actions: read

  actionlint:
    uses: $/.github/workflows/actionlint.yml
    permissions:
      security-events: write
      contents: read
      actions: read

  socket:
    uses: $/.github/workflows/socket.yml
    secrets:
      SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
    permissions:
      issues: write
      contents: read
      pull-requests: write
      security-events: write
      actions: read

  sbom:
    needs: vuln-check
    name: Generate SBOMs
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Apply version
        run: python3 .github/update_version_in_cargo.py "$PRODUCT_VERSION"
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft
        with:
          syft-version: v1.52.0
      - name: Generate CycloneDX and SPDX SBOMs
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          "$SYFT_CMD" dir:. --source-version "$version"
          mkdir -p sbom-out
          mv cargo-project-tools.cdx.json cargo-project-tools.spdx.json sbom-out/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom-out/
          if-no-files-found: error

  # Every OS the tool is released for: paths, file times and process handling differ.
  test:
    needs: vuln-check
    name: Test (${{ matrix.os }})
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    env:
      # sfw's local CA has no CRL/OCSP endpoint; schannel can't check revocation.
      CARGO_HTTP_CHECK_REVOKE: ${{ startsWith(matrix.os, 'windows') && 'false' || 'true' }}
      # No debug info in test builds: less to compile and link, on runners that cost more.
      CARGO_PROFILE_DEV_DEBUG: "0"
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install --no-self-update
      - uses: osseco/setup-sfw-free@e1cbeae80920eb20b289196bb420d5f45a45ead1 # v1.15.6-0.2.0
        with:
          cache: ${{ github.ref == 'refs/heads/main' && 'true' || 'restore' }}
      # Before "Apply version", which rewrites Cargo.lock: the key must not depend on the run's version.
      # The toolchain is part of the fallback prefix: another compiler's target/ is never reused.
      - name: Cache key
        id: cache-key
        env:
          TOOLCHAIN_HASH: ${{ hashFiles('rust-toolchain.toml') }}
          LOCK_HASH: ${{ hashFiles('Cargo.lock') }}
        run: |
          prefix="test-${RUNNER_OS}-${TOOLCHAIN_HASH}-"
          echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}${LOCK_HASH}" >> "$GITHUB_OUTPUT"
      - name: Apply version
        run: python3 .github/update_version_in_cargo.py "$PRODUCT_VERSION"
      # Main builds the cache, once per Cargo.lock and toolchain; everything else uses it,
      # falling back to main's newest entry for the same toolchain when the lock differs.
      - name: Restore test build from main
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.cache-key.outputs.prefix }}
      - run: sfw cargo test --locked
      # Only checks whether main already saved this lock's build; downloads nothing.
      - name: Look up test build
        id: test-cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          lookup-only: true
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cache-key.outputs.key }}
      - name: Save test build
        if: github.ref == 'refs/heads/main' && steps.test-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cache-key.outputs.key }}

  # The tool end to end on Linux (scripts/e2e.sh): a real install, a required sandbox
  # that's missing, an offline install from what `check` prepared with no network and a
  # read-only CARGO_HOME, and a build in bwrap. Nothing here is released.
  e2e:
    needs: vuln-check
    name: End to end (Linux)
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install --no-self-update
      - uses: osseco/setup-sfw-free@e1cbeae80920eb20b289196bb420d5f45a45ead1 # v1.15.6-0.2.0
        with:
          cache: ${{ github.ref == 'refs/heads/main' && 'true' || 'restore' }}
      - run: sfw cargo build --locked
      - name: End to end
        run: |
          PATH="$GITHUB_WORKSPACE/target/debug:$PATH" scripts/e2e.sh "$RUNNER_TEMP/e2e"

  pre-commit:
    needs: vuln-check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install --no-self-update
      - uses: osseco/setup-sfw-free@e1cbeae80920eb20b289196bb420d5f45a45ead1 # v1.15.6-0.2.0
        with:
          cache: ${{ github.ref == 'refs/heads/main' && 'true' || 'restore' }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: zizmor
      - name: Apply version
        run: python3 .github/update_version_in_cargo.py "$PRODUCT_VERSION"
      # cargo-deny runs in vuln-check, tests in test, actionlint in actionlint.yml.
      # The cargo hooks call sfw themselves; nesting it is fine.
      - name: pre-commit
        env:
          SKIP: cargo-deny,cargo-test,actionlint
        run: sfw uv tool run --with pre-commit-uv pre-commit run --all-files --show-diff-on-failure

  build:
    needs: [vuln-check, socket]
    name: Build (${{ matrix.target }})
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    env:
      # sfw's local CA has no CRL/OCSP endpoint; schannel can't check revocation.
      # Only cargo on Windows checks revocation; elsewhere this is cargo's default.
      CARGO_HTTP_CHECK_REVOKE: ${{ startsWith(matrix.os, 'windows') && 'false' || 'true' }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs['all-targets'] && '[{"os":"macos-latest","target":"aarch64-apple-darwin","cross":false},{"os":"ubuntu-latest","target":"aarch64-unknown-linux-musl","cross":true},{"os":"ubuntu-latest","target":"x86_64-unknown-linux-musl","cross":true},{"os":"windows-latest","target":"x86_64-pc-windows-msvc","cross":false}]' || '[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-musl","cross":true}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup set profile minimal
          rustup toolchain install --no-self-update
          rustup target add "$TARGET"
      - uses: osseco/setup-sfw-free@e1cbeae80920eb20b289196bb420d5f45a45ead1 # v1.15.6-0.2.0
        with:
          cache: ${{ github.ref == 'refs/heads/main' && 'true' || 'restore' }}
      - name: Apply version
        run: python3 .github/update_version_in_cargo.py "$PRODUCT_VERSION"
      # Built from a pinned commit every time; never restored from a cache.
      - name: Install cross
        if: matrix.cross
        run: sfw cargo install cross --locked --git https://github.com/cross-rs/cross --rev 49cd054de9b832dfc11a4895c72b0aef533b5c6a
      # Pinned and built from source every time, like cross. cargo-auditable embeds
      # the dependency list in the binary; rust-audit-info checks that it's there.
      - name: Install cargo-auditable and rust-audit-info
        env:
          USE_CROSS: ${{ matrix.cross && 'true' || 'false' }}
          AUDITABLE_ROOT: ${{ runner.temp }}/cargo-auditable
        run: |
          set -euo pipefail
          if [[ "$USE_CROSS" == "true" ]]; then
            # A static build, so it also runs inside the cross container. Not in
            # CARGO_HOME/bin: cross hides that directory in the container.
            rustup target add x86_64-unknown-linux-musl
            sfw cargo install cargo-auditable --locked --version 0.7.7 --target x86_64-unknown-linux-musl --root "$AUDITABLE_ROOT"
          else
            sfw cargo install cargo-auditable --locked --version 0.7.7
          fi
          sfw cargo install rust-audit-info --locked --version 0.5.4
      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
          USE_CROSS: ${{ matrix.cross && 'true' || 'false' }}
          AUDITABLE_ROOT: ${{ runner.temp }}/cargo-auditable
        run: |
          set -euo pipefail
          # Fetch through sfw, then build offline: cross runs cargo in a container
          # that can't reach the sfw proxy, but it mounts this CARGO_HOME.
          sfw cargo fetch --locked --target "$TARGET"
          if [[ "$USE_CROSS" == "true" ]]; then
            # cross runs `cross auditable build` on the host, so set up what
            # `cargo auditable` would: the rustc wrapper and the original cargo flags.
            # Cross.toml mounts AUDITABLE_ROOT at the same path and passes the wrapper on.
            RUSTC_WORKSPACE_WRAPPER="$AUDITABLE_ROOT/bin/cargo-auditable" \
            CARGO_AUDITABLE_ORIG_ARGS='{"offline":false,"locked":false,"frozen":true,"config":[]}' \
              cross build --release --frozen --target "$TARGET"
          else
            cargo auditable build --release --frozen --target "$TARGET"
          fi
          suffix=""
          case "$TARGET" in
            *windows*) suffix=".exe" ;;
          esac
          mkdir -p release-bin
          cp "target/${TARGET}/release/cargo-project-tools${suffix}" "release-bin/cargo-project-tools-${TARGET}${suffix}"
          # Fails when the binary has no embedded dependency list.
          rust-audit-info "release-bin/cargo-project-tools-${TARGET}${suffix}" > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: release-bin/
          if-no-files-found: error
