name: Product

on:
  workflow_call:
    inputs:
      all-targets:
        description: Build every release target
        type: boolean
        default: false
      version:
        description: Cargo version, X.Y.Z or X.Y.Z-pr.N.N.N
        type: string
        required: true
    secrets:
      SOCKET_SECURITY_API_KEY:
        required: false

permissions: {}

env:
  PRODUCT_VERSION: ${{ inputs.version }}
  # Every job starts with an empty target/, so incremental output is never reused.
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

# No actions/cache in this workflow: release.yml builds the signed binaries with it,
# and a restored cache entry could be written by any workflow run on main.

jobs:
  vuln-check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans licenses sources
      # cargo-audit stays outside sfw: its TLS verifier rejects the sfw CA.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit
      - run: cargo audit

  codeql:
    uses: $/.github/workflows/codeql.yml
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

  zizmor:
    uses: $/.github/workflows/zizmor.yml
    permissions:
      security-events: write
      contents: read
      actions: read

  actionlint:
    uses: $/.github/workflows/actionlint.yml
    permissions:
      security-events: write
      contents: read
      actions: read

  socket:
    uses: $/.github/workflows/socket.yml
    secrets:
      SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
    permissions:
      issues: write
      contents: read
      pull-requests: write

  sbom:
    needs: vuln-check
    name: Generate SBOMs
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Apply version
        run: python3 .github/update_version_in_cargo.py "$PRODUCT_VERSION"
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft
        with:
          syft-version: v1.52.0
      - name: Generate CycloneDX and SPDX SBOMs
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          "$SYFT_CMD" dir:. --source-version "$version"
          mkdir -p sbom-out
          mv cargo-project-tools.cdx.json cargo-project-tools.spdx.json sbom-out/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom-out/
          if-no-files-found: error

  test:
    needs: vuln-check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install --no-self-update
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: v1.16.0
          job-summary: errors
      - name: Apply version
        run: python3 .github/update_version_in_cargo.py "$PRODUCT_VERSION"
      - run: sfw cargo test --locked

  pre-commit:
    needs: vuln-check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install --no-self-update
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: v1.16.0
          job-summary: errors
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: zizmor
      - name: Apply version
        run: python3 .github/update_version_in_cargo.py "$PRODUCT_VERSION"
      # cargo-deny and cargo-audit run in vuln-check, tests in test, actionlint in
      # actionlint.yml. The cargo hooks call sfw themselves; nesting it is fine.
      - name: pre-commit
        env:
          SKIP: cargo-deny,cargo-audit,cargo-test,actionlint
        run: sfw uv tool run --with pre-commit-uv pre-commit run --all-files --show-diff-on-failure

  build:
    needs: [vuln-check, socket]
    name: Build (${{ matrix.target }})
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs['all-targets'] && '[{"os":"macos-latest","target":"aarch64-apple-darwin","cross":false},{"os":"ubuntu-latest","target":"aarch64-unknown-linux-musl","cross":true},{"os":"ubuntu-latest","target":"x86_64-unknown-linux-musl","cross":true},{"os":"windows-latest","target":"x86_64-pc-windows-msvc","cross":false}]' || '[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-musl","cross":true}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup set profile minimal
          rustup toolchain install --no-self-update
          rustup target add "$TARGET"
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: v1.16.0
          job-summary: errors
      - name: Apply version
        run: python3 .github/update_version_in_cargo.py "$PRODUCT_VERSION"
      # Built from a pinned commit every time; never restored from a cache.
      - name: Install cross
        if: matrix.cross
        run: sfw cargo install cross --locked --git https://github.com/cross-rs/cross --rev 49cd054de9b832dfc11a4895c72b0aef533b5c6a
      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
          USE_CROSS: ${{ matrix.cross && 'true' || 'false' }}
        run: |
          set -euo pipefail
          # Fetch through sfw, then build offline: cross runs cargo in a container
          # that can't reach the sfw proxy, but it mounts this CARGO_HOME.
          sfw cargo fetch --locked --target "$TARGET"
          if [[ "$USE_CROSS" == "true" ]]; then
            cross build --release --frozen --target "$TARGET"
          else
            cargo build --release --frozen --target "$TARGET"
          fi
          suffix=""
          case "$TARGET" in
            *windows*) suffix=".exe" ;;
          esac
          mkdir -p release-bin
          cp "target/${TARGET}/release/cargo-project-tools${suffix}" "release-bin/cargo-project-tools-${TARGET}${suffix}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: release-bin/
          if-no-files-found: error
