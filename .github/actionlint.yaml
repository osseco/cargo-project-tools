paths:
  "**/*.{yml,yaml}":
    ignore:
      # `uses: $/...` calls a workflow of the same repository at the same ref.
      # It works on github.com and is intentional; this actionlint release does
      # not know the form.
      - 'is not following the format "owner/repo/path/to/workflow\.yml@ref"'
      - 'specifying action "\$/'
      # `concurrency.queue: max` (GitHub, May 2026) keeps every pending release run
      # instead of only the latest; this actionlint release doesn't know the key yet.
      - 'unexpected key "queue" for "concurrency" section'
