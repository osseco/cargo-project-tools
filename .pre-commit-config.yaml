repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict

  # Tools are expected on PATH (see AGENTS.md).
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --locked --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-test
        name: cargo test
        entry: cargo test --locked
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-deny
        name: cargo deny
        entry: cargo deny --locked check
        language: system
        files: ^(Cargo\.(toml|lock)|deny\.toml)$
        pass_filenames: false
      - id: cargo-audit
        name: cargo audit
        entry: cargo audit
        language: system
        files: ^Cargo\.lock$
        pass_filenames: false
      - id: zizmor
        name: zizmor
        entry: zizmor --offline .github/workflows
        language: system
        files: ^\.github/workflows/
        pass_filenames: false
      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        files: ^\.github/workflows/
        pass_filenames: false
