<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cargo project-tools — cargo tools from your own Cargo.lock files</title>
    <meta name="description" content="Install your project's cargo tools from Cargo.lock files you keep, audit and fix in your own repository." />
    <script>
      // Set the theme before first paint so the page never flashes the wrong one.
      // Keep in sync with src/lib/theme.ts.
      (() => {
        let stored = null;
        try {
          stored = localStorage.getItem("osseco-theme");
        } catch {}
        const dark =
          stored === "dark" ||
          (stored !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body class="min-h-full flex flex-col bg-background text-foreground antialiased">
    <div id="root" class="min-h-full flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
